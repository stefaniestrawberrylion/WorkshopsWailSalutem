services:
  db:
    image: mysql:8.1
    restart: always
    environment:
      MYSQL_DATABASE: workshops
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/workshops?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: example
    command: >
      sh -c "echo 'Waiting for MySQL...' &&
             until nc -z db 3306; do sleep 3; done &&
             echo 'MySQL is up! Starting app...' &&
             java -jar app.jar"

volumes:
  mysql-data:
